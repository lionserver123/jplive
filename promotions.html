<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>JP真人優惠活動</title>
<meta name="description" content="JP真人優惠活動：輸了我來扛、新手體驗禮、限時加碼送、會員專屬禮與限時瘋週末。">
<link rel="icon" href="img/favicon.ico" sizes="48x48"><link rel="icon" href="img/favicon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="img/apple-touch-icon.png"><meta name="theme-color" content="#032116"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;600;800&family=Noto+Sans+TC:wght@400;500;600;700;900&display=swap">
<style>
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; }
/* JP Live — shared styles. Tokens come from the Figma file's styles (品牌主色 / 品牌深色 / 品牌輔色 / 品牌亮色 / 品牌副輔色). */
:root {
  --brand: #003f30;      /* 品牌主色 */
  --brand-deep: #032116; /* 品牌深色 */
  --brand-mid: #26776c;  /* 品牌輔色 */
  --brand-bright: #00ad90; /* 品牌亮色 */
  --mint: #35a495;
  --gold: #ffd43b;       /* 品牌副輔色 */
  --gold-edge: #fff156;
  --ink: #000;
  --ink-soft: #333;
  --white: #fff;
  --paper: #fafcfb;
  --font-ch: "Noto Sans TC", "Noto Sans", "PingFang TC", "Microsoft JhengHei", sans-serif;
  --font-en: "Inter", "Noto Sans TC", system-ui, sans-serif;
  --gutter: 56px;
  --maxw: 1610px;
}
*, *::before, *::after { box-sizing: border-box; }
html { scroll-behavior: smooth; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } *, *::before, *::after { animation: none !important; transition: none !important; } }
body { margin: 0; font-family: var(--font-ch); font-size: 16px; line-height: 24px; font-weight: 400; overflow-x: hidden; }
img { max-width: 100%; display: block; }
a { color: inherit; text-decoration: none; }
a:focus-visible, button:focus-visible, summary:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }
p { margin: 0; }
h1, h2, h3, h4 { margin: 0; text-wrap: balance; }

.wrap { width: 100%; max-width: var(--maxw); margin-inline: auto;
  padding-left: max(var(--gutter), env(safe-area-inset-left, 0px));
  padding-right: max(var(--gutter), env(safe-area-inset-right, 0px)); }

/* ---------- Buttons (190 x 50 everywhere; hover states from the Figma UI page) ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; height: 50px; width: 180px; flex: none;
  border-radius: 80px; border: 1px solid var(--white); font-weight: 400; font-size: 16px; line-height: 24px;
  white-space: nowrap; cursor: pointer; transition: background-color .3s linear, color .3s linear, border-color .3s linear, box-shadow .3s linear; }
.btn-white { background: var(--white); color: var(--brand); }
.btn-white:hover { background: var(--mint); border-color: var(--brand-bright); color: var(--white); transition-duration: .35s; }
.btn-green { background: var(--brand); color: var(--white); }
.btn-green:hover { background: var(--white); border-color: var(--brand-bright); color: var(--brand); }
.btn-ghost { background: transparent; color: var(--white); }
.btn-ghost:hover { background: var(--white); color: var(--brand-deep); }
.btn-gold { background: var(--gold); color: var(--brand); border-color: var(--gold-edge); }
.btn-gold:hover { box-shadow: 0 0 20px #ffe100; }
.btn-row { display: flex; gap: 10px; flex-wrap: wrap; }

/* ---------- Header ---------- */
.site-header { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 50;
  background: linear-gradient(to bottom, #000604 0%, var(--brand-deep) 61%); border-bottom: 1px solid var(--white); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 60; background: #000604; }
.site-header .wrap { height: 96px; display: flex; align-items: center; justify-content: space-between; gap: 24px; }
.logo img { width: 101px; height: 48px; }
.nav { display: flex; align-items: center; }
.nav-links { display: flex; }
.nav-links a { width: 160px; height: 50px; padding: 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
  color: var(--white); font-weight: 400; position: relative; }
.nav-links a::after { content: ""; width: 58px; height: 2px; background: transparent; transition: background-color .35s linear; }
.nav-links a:hover::after, .nav-links a[aria-current="page"]::after { background: var(--white); }
.head-reg { display: none; }
.nav-toggle { display: none; width: 44px; height: 44px; border: 1px solid rgba(255,255,255,.5); border-radius: 10px; background: transparent; color: var(--white); cursor: pointer; align-items: center; justify-content: center; }
.nav-toggle .bars { position: relative; width: 20px; height: 12px; display: block; }
.nav-toggle .bars span { position: absolute; left: 0; width: 100%; height: 2px; border-radius: 2px; background: currentColor; transition: top .25s ease, transform .25s ease; }
.nav-toggle .bars span:first-child { top: 0; }
.nav-toggle .bars span:last-child { top: 10px; }
.nav-toggle[aria-expanded="true"] .bars span { top: 5px; }
.nav-toggle[aria-expanded="true"] .bars span:first-child { transform: rotate(45deg); }
.nav-toggle[aria-expanded="true"] .bars span:last-child { transform: rotate(-45deg); }
@media (prefers-reduced-motion: reduce) { .nav-toggle .bars span { transition: none; } }

@media (max-width: 1280px) { .nav-links a { width: auto; min-width: 88px; padding-inline: 14px; } }
@media (max-width: 1040px) {
  .nav-toggle { display: inline-flex; }
  .nav { position: absolute; top: 100%; left: 0; right: 0; background: var(--brand-deep); border-bottom: 1px solid var(--brand-mid);
    flex-direction: column; align-items: stretch; padding: 8px max(16px, env(safe-area-inset-right, 0px)) 20px max(16px, env(safe-area-inset-left, 0px)); gap: 12px; }
  .nav:not(.open) { display: none; }
  .nav-links { flex-direction: column; }
  .nav-links a { width: 100%; height: 48px; align-items: center; text-align: center; border-bottom: 1px solid rgba(255,255,255,.08); }
  .nav > .btn { display: none; }
  .head-reg { display: inline-flex; margin-left: auto; }
  .nav-links a::after { display: none; }
}

/* ---------- Footer ---------- */
.site-footer { border-top: 1px solid var(--white); background: linear-gradient(to top, #000604 0%, var(--brand-deep) 61%); color: var(--white); }
.site-footer .wrap { padding-block: 60px; display: flex; gap: 60px; align-items: center; justify-content: center; flex-wrap: wrap; }
.licences { display: flex; gap: 60px; align-items: center; flex-wrap: wrap; justify-content: center; }
.licences img { height: auto; }
.foot-cols { display: flex; gap: 16px; align-items: flex-start; }
.foot-col { width: 109px; display: flex; flex-direction: column; gap: 8px; align-items: center; }
.foot-col h4 { font-size: 16px; font-weight: 400; line-height: 24px; }
.foot-col ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; width: 100%; }
.foot-col a { display: block; padding: 4px 8px; font-size: 12px; line-height: 15px; text-align: center; transition: opacity .35s linear; }
.foot-col a:hover { opacity: .5; }
.stores { display: flex; flex-direction: column; gap: 8px; width: 120px; }
.stores img { width: 120px; height: 40px; }
@media (max-width: 760px) {
  .site-footer .wrap { gap: 36px; padding-block: 40px; }
  .licences { gap: 24px 32px; }
  .licences img { transform: scale(.82); }
  .foot-cols { flex-wrap: wrap; justify-content: center; }
}

/* ---------- Section heading (icon box + zh/en titles) ---------- */
.sec-head { display: flex; gap: 24px; align-items: center; }
.sec-head.center { flex-direction: column; text-align: center; }
.icon-box { flex: none; width: 40px; height: 40px; border: 2px solid var(--white); border-radius: 8px; display: grid; place-items: center; }
.icon-box svg { display: block; }
.icon-box.bare { border: 0; width: 42px; height: 42px; }
.sec-titles { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.sec-titles h2 { font-size: 38px; line-height: 42px; font-weight: 700; }
.sec-titles .en { font-family: var(--font-en); font-weight: 300; font-size: 24px; line-height: 1.1; }
.sec-titles .en.semi { font-family: var(--font-ch); font-weight: 400; font-size: 16px; line-height: 24px; } /* Body style (Figma 4193:2211) */

@media (max-width: 760px) {
  :root { --gutter: 16px; }
  .sec-titles h2 { font-size: 28px; line-height: 34px; }
  .sec-titles .en { font-size: 18px; }
  .sec-titles { gap: 10px; }
}
.visually-hidden { position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }

/* Back to top (Figma 4213:10029) */
.to-top { position: fixed; right: max(24px, env(safe-area-inset-right, 0px) + 16px, (100vw - 1920px) / 2 + 24px); /* stays inside a 1920px-wide area */ bottom: max(24px, env(safe-area-inset-bottom, 0px) + 16px); z-index: 60;
  width: 60px; height: 60px; padding: 0; border: 0; border-radius: 50%; background: none; cursor: pointer;
  filter: drop-shadow(0 4px 6px rgba(0,0,0,.3)); opacity: 0; visibility: hidden; transform: translateY(12px);
  transition: opacity .3s linear, visibility .3s linear, transform .3s ease, filter .3s linear; }
.to-top.show { opacity: 1; visibility: visible; transform: none; }
.to-top:hover { transform: translateY(-3px); filter: drop-shadow(0 6px 10px rgba(0,0,0,.4)) brightness(1.05); }
.to-top:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
.to-top svg { display: block; }
@media (max-width: 760px) { .to-top, .to-top svg { width: 48px; height: 48px; } }

/* Phones: button rows sit side by side and centred; single buttons are centred */
@media (max-width: 760px) {
  .btn-row { justify-content: center; flex-wrap: wrap; align-self: stretch !important; }  /* 180px buttons: side by side when they fit, stacked otherwise */
  .hero-copy > .btn, .split-copy > .btn { align-self: center !important; }
  .game-body .btn { margin-inline: auto; }
}

@media (max-width: 760px) { .site-header .wrap { gap: 12px; } }
@media (max-width: 380px) { .logo img { width: 80px; height: auto; } }

/* Home: single dark look, as in the Figma frame XL-1440 */
:root { color-scheme: dark; }
body { background: #0f1c1c; }
.home { color: var(--white); position: relative; isolation: isolate;
  background: #0f1c1c url(img/bg.jpg) center top / cover no-repeat; }
/* On narrow, very tall pages "cover" would blow the suit pattern up; pin it to the screen instead */
@media (max-width: 1023px) {
  .home { background: #0f1c1c; }
  .home::before { content: ""; position: fixed; inset: 0; z-index: -1; background: url(img/bg.jpg) center / cover no-repeat; }
}
.home main { display: flex; flex-direction: column; gap: 72px; padding-block: 72px; }
.home main > section { display: flex; flex-direction: column; gap: 32px; }

.panel { background: var(--brand-deep); border: 2px solid var(--mint); border-radius: 40px; padding: 8px; overflow: hidden; }

/* Hero */
.hero-stack { display: flex; flex-direction: column; gap: 24px; }
.hero { display: flex; align-items: stretch; }
.hero-img { flex: 0 1 850px; min-width: 0; border-radius: 32px; overflow: hidden; aspect-ratio: 850 / 448; }
.hero-img img, .media img { width: 100%; height: 100%; object-fit: cover; }
.hero-copy { flex: 1 1 0; min-width: 0; padding: 36px; display: flex; flex-direction: column; justify-content: center; gap: 24px; }
.copy-block { display: flex; flex-direction: column; gap: 16px; }
.h1 { color: var(--gold); font-size: 38px; line-height: 42px; font-weight: 700; }
.h1 .en { font-family: var(--font-en); font-weight: 800; font-size: 36px; }
.sub { font-size: 24px; line-height: 28px; font-weight: 600; }

/* News ticker: scrolls continuously at the Figma speed (3052px per 10s); script sets the duration */
.ticker { display: flex; align-items: center; background: var(--brand-deep); border: 2px solid var(--mint); border-radius: 16px; overflow: hidden; }
.ticker-tag { --tip: 22px; flex: none; width: 176px; height: 56px; padding-right: var(--tip); margin-right: calc(var(--tip) * -1); background: var(--gold); color: var(--brand); display: flex; align-items: center; justify-content: center; gap: 12px; font-size: 24px; line-height: 28px; font-weight: 600; position: relative; z-index: 1;
  clip-path: polygon(0 0, calc(100% - var(--tip)) 0, 100% 50%, calc(100% - var(--tip)) 100%, 0 100%); }
.ticker-tag .dot { width: 9px; height: 9px; background: var(--brand-deep); transform: rotate(45deg); flex: none; }
.ticker-view { padding-left: var(--tip-gap, 22px); }
.ticker-view { flex: 1; min-width: 0; overflow: hidden; }
.ticker-track { display: flex; width: max-content; animation: ticker var(--ticker-dur, 11s) linear infinite; }
.ticker:hover .ticker-track, .ticker:focus-within .ticker-track { animation-play-state: paused; }
.ticker-track a { display: flex; align-items: center; gap: 12px; height: 56px; padding-left: 36px; white-space: nowrap; background: var(--brand-deep); transition: background-color .35s linear, color .35s linear; }
.ticker-track a:hover { background: #043020; color: var(--gold); }
.ticker-track a::after { content: ""; width: 1px; height: 24px; background: #d9d9d9; margin-left: 24px; }
@keyframes ticker { to { transform: translateX(-50%); } }

/* Animated gradient border (Figma: Default → Variant2 → Variant3 loop, after-timeout smart animate) */
@property --c0 { syntax: "<color>"; inherits: false; initial-value: #35a495; }
@property --c1 { syntax: "<color>"; inherits: false; initial-value: #35a495; }
@property --c2 { syntax: "<color>"; inherits: false; initial-value: #35a495; }
@property --c3 { syntax: "<color>"; inherits: false; initial-value: #35a495; }
.shine { border: 2px solid transparent;
  background: var(--inner) padding-box, linear-gradient(to bottom right, var(--c0) 0%, var(--c1) 10%, var(--c2) 90%, var(--c3) 100%) border-box; }
.shine-game { --inner: linear-gradient(var(--brand-deep), var(--brand-deep)); animation: shine-game 2.55s linear infinite; }
.shine-dark { --inner: var(--inner-dark, radial-gradient(120% 140% at 100% 100%, #18674a 0%, #0e4430 30%, #083223 46%, var(--brand-deep) 61%));
  --c0: var(--brand); --c1: var(--brand); --c2: var(--brand); --c3: var(--brand); animation: shine-dark 3s linear infinite; }
@keyframes shine-game {
  0%, 11.8%   { --c0: #35a495; --c1: #35a495; --c2: #35a495; --c3: #35a495; }
  25.5%       { --c0: #26776c; --c1: #2a8276; --c2: #47ddc9; --c3: #f2ff8e; }
  56.9%, 68.6% { --c0: #f2ff8e; --c1: #47ddc9; --c2: #2a8276; --c3: #26776c; }
  100%        { --c0: #35a495; --c1: #35a495; --c2: #35a495; --c3: #35a495; }
}
@keyframes shine-dark {
  0%, 10%     { --c0: #003f30; --c1: #003f30; --c2: #003f30; --c3: #003f30; }
  36.7%       { --c0: #003f30; --c1: #085041; --c2: #47ddc9; --c3: #f2ff8e; }
  63.3%, 73.3% { --c0: #f2ff8e; --c1: #47ddc9; --c2: #085041; --c3: #003f30; }
  100%        { --c0: #003f30; --c1: #003f30; --c2: #003f30; --c3: #003f30; }
}

/* Game cards */
.grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 24px; }
.grid-4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 24px; }
.grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px; }
.game { border-radius: 28px; overflow: hidden; display: flex; flex-direction: column; }
.game .media { aspect-ratio: 600 / 272; }
.game-body { display: flex; gap: 8px; align-items: center; padding: 36px; flex-wrap: wrap; }
.game-body > div { flex: 1 1 180px; min-width: 0; display: flex; flex-direction: column; gap: 16px; }
.card-title { font-family: var(--font-en); font-weight: 800; font-size: 28px; line-height: 1.2; color: var(--gold); }

/* Split panels (RG / brand) */
.split { display: flex; min-height: 360px; }
.split > .media { flex: 1 1 0; min-width: 0; border-radius: 32px 0 0 32px; overflow: hidden; }
.split.reverse > .media { border-radius: 0 32px 32px 0; }
.split-copy { flex: 1 1 0; min-width: 0; padding: 48px; display: flex; flex-direction: column; justify-content: center; gap: 24px; }
.h1-en { font-family: var(--font-en); font-weight: 800; font-size: 36px; line-height: 42px; color: var(--gold); }

/* Advantages */
/* Figma 4030:512: animated gradient border (Default → Variant2 → Variant3, 3s loop);
   image sits under a 30% black veil, hover brings it back to full colour (0.3s) */
.adv { --inner-dark: linear-gradient(var(--brand-deep), var(--brand-deep)); border-radius: 28px; overflow: hidden; display: flex; flex-direction: column; }
.adv .media { aspect-ratio: 1; position: relative; }
.adv .media img, .promo img { filter: brightness(.7); transition: filter .3s linear; }
.adv:hover .media img, .promo:hover img { filter: none; }
.glow { background: radial-gradient(120% 140% at 100% 100%, #18674a 0%, #0e4430 30%, #083223 46%, var(--brand-deep) 61%); }
.adv-body { flex: 1; padding: 36px; text-align: center; display: flex; flex-direction: column; gap: 16px; align-items: center; }

/* Demo */
.demo { display: flex; flex-direction: column; }
.demo-stage { position: relative; border-radius: 32px; overflow: hidden; aspect-ratio: 1478 / 832; }
.demo-stage img { width: 100%; height: 100%; object-fit: cover; }
/* the exported image carries the button; this live 190 x 50 button sits exactly on top of it */
.demo-stage .btn { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); }
.demo-copy { padding: 32px 48px; text-align: center; display: flex; flex-direction: column; gap: 16px; align-items: center; }

/* Features */
.feat { border-radius: 28px; padding: 36px; display: flex; flex-direction: column; gap: 16px; align-items: center; text-align: center; }
.feat-title { display: flex; align-items: center; gap: 16px; width: 100%; }
.feat-title::before, .feat-title::after { content: ""; flex: 1; height: 1px; background: var(--gold); }
.feat-title h3 { font-family: var(--font-en); font-weight: 800; font-size: 28px; line-height: 1.2; color: var(--gold); }

/* FAQ: closed = Variant2, open = Variant3 */
.faq-list { display: flex; flex-direction: column; gap: 32px; }
.faq { border: 2px solid var(--brand-bright); border-radius: 32px; overflow: hidden; background: var(--brand); transition: border-color .35s linear; }
/* hover (closed): Figma 4155:4677 */
.faq:not([open]):hover { border-color: #ffedac; }
.faq:not([open]):hover summary { background: var(--gold); }
.faq:not([open]):hover .num { border-color: var(--brand); color: var(--brand); }
.faq:not([open]):hover .q { color: var(--brand); }
.faq summary { list-style: none; background: var(--brand); padding: 32px; display: flex; align-items: center; gap: 24px; cursor: pointer; border-radius: 30px; transition: background-color .35s linear; }
.faq summary::-webkit-details-marker { display: none; }
.faq .num { flex: none; width: 40px; height: 40px; border: 1px solid var(--gold); border-radius: 8px; display: grid; place-items: center; color: var(--gold); font-weight: 900; font-size: 16px; transition: background-color .35s linear, color .35s linear, border-color .35s linear; }
.faq .q { flex: 1; min-width: 0; font-size: 18px; line-height: 20px; font-weight: 600; transition: color .35s linear; }
.faq .plus { flex: none; }
.faq .plus .v { transition: opacity .3s linear; }
.faq[open] summary { background: var(--gold); border-radius: 0; }
.faq[open] .num { background: #fff159; border-color: #fff159; color: var(--brand-deep); }
.faq[open] .q { color: #000; }
.faq[open] .plus .v { opacity: 0; }
.faq .a { padding: 32px 32px 32px 96px; color: var(--white); }

/* Posts */
.post { background: var(--brand); border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 24px; filter: drop-shadow(0 6px 3px rgba(0,0,0,.25)); transition: background-color .35s linear; }
.post:hover { background: #004b39; }
.post .media { aspect-ratio: 400 / 256; border-radius: 8px; overflow: hidden; }
.post-text { display: flex; flex-direction: column; gap: 16px; }
.post h3 { font-size: 24px; line-height: 28px; font-weight: 600; }
.post .tag { color: var(--mint); }

@media (max-width: 1200px) {
  .hero { flex-direction: column; }
  .hero-img { flex: none; }
  .grid-4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .grid-3.posts { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .game-body { padding: 24px; }
}
@media (max-width: 900px) {
  .grid-3 { grid-template-columns: minmax(0, 1fr); }
  .grid-2 { grid-template-columns: minmax(0, 1fr); }
  .split, .split.reverse { flex-direction: column; min-height: 0; }
  .split > .media, .split.reverse > .media { order: -1; border-radius: 32px 32px 0 0; aspect-ratio: 691 / 340; flex: none; }
  .split-copy { padding: 28px 20px 24px; }
}
@media (max-width: 760px) {
  .home main { gap: 56px; padding-block: 32px; }
  .panel { border-radius: 24px; padding: 6px; }
  .hero-img, .demo-stage { border-radius: 18px; }
  .split > .media, .split.reverse > .media { border-radius: 18px 18px 0 0; }
  .hero-copy { padding: 24px 14px 18px; }
  .h1, .h1 .en, .h1-en { font-size: 28px; line-height: 34px; }
  .sub { font-size: 20px; }
  .ticker-tag { --tip: 16px; width: 124px; font-size: 18px; height: 48px; gap: 8px; }
  .ticker-tag .dot { width: 7px; height: 7px; }
  .ticker-view { --tip-gap: 16px; }
  .ticker-track a { height: 48px; font-size: 14px; padding-left: 20px; }
  .grid-4 { gap: 16px; }
  .adv-body { padding: 18px 12px; }
